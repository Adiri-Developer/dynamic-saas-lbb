name: CI/CD Pipeline SaaS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # JOB 1: Dijalankan di server GitHub (Pembungkusan Docker)
  docker-build-and-push:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/saas-lbb:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # JOB 2: Dijalankan LANGSUNG di server self-hosted kamu
  deploy:
    name: Deploy to Server
    needs: docker-build-and-push
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Pull and Run Docker Container
        run: |
          echo "Menarik image terbaru dari DockerHub..."
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/saas-lbb:latest

          echo "Menghentikan dan menghapus container lama (jika ada)..."
          docker stop saas-lbb || true
          docker rm saas-lbb || true

          echo "Membersihkan image lama yang menggantung..."
          docker image prune -f

          echo "Menjalankan container baru..."
          # Pastikan file .env ada di direktori server tempat runner berjalan
          # Volume mapping untuk storage agar file upload tidak hilang saat deploy ulang
          docker run -d \
            --name saas-lbb \
            -p 127.0.0.1:9000:9000 \
            --env-file /var/www/saas-lbb/.env \
            -v /var/www/saas-lbb/storage:/app/storage \
            ${{ secrets.DOCKERHUB_USERNAME }}/saas-lbb:latest

